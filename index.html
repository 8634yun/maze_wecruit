<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const SIZE = 520;
const MAX_HEARTS = 6;

/* ---------- 난이도 ---------- */
const LEVELS = {
  easy: {
    name: '자비', hearts: 5, grow: 2, maxCols: 20,
    traps: lv => 1 + lv, chaserFrom: 2, chaserStep: 950,
    chasers: lv => 1, grace: 3500, keys: lv => Math.min(1 + Math.floor((lv - 1) / 3), 2),
    braid: 1, loops: 0.14,
    desc: '느린 추적자 · 심장 5 · 막다른 길 없음'
  },
  normal: {
    name: '고통', hearts: 3, grow: 2, maxCols: 24,
    traps: lv => 3 + lv * 2, chaserFrom: 1, chaserStep: 620,
    chasers: lv => (lv >= 5 ? 2 : 1), grace: 2500, keys: lv => Math.min(1 + Math.floor((lv - 1) / 2), 3),
    braid: 0.9, loops: 0.09,
    desc: '추적자 1 · 심장 3 · 5층부터 둘'
  },
  hard: {
    name: '참혹', hearts: 3, grow: 3, maxCols: 26,
    traps: lv => 4 + lv * 2, chaserFrom: 1, chaserStep: 430,
    chasers: lv => (lv >= 3 ? 2 : 1), grace: 1800, keys: lv => Math.min(1 + Math.floor((lv - 1) / 2), 4),
    braid: 0.75, loops: 0.06,
    desc: '빠른 추적자 · 막다른 길 존재'
  },
  nightmare: {
    name: '지옥', hearts: 2, grow: 3, maxCols: 28,
    traps: lv => 6 + lv * 3, chaserFrom: 1, chaserStep: 300,
    chasers: lv => Math.min(2 + Math.floor(lv / 3), 4), grace: 1200, keys: lv => Math.min(2 + Math.floor((lv - 1) / 2), 5),
    braid: 0.55, loops: 0.04,
    desc: '무리 추적 · 심장 2 · 아가리 천지'
  }
};
let diff = 'normal';
const D = () => LEVELS[diff];

/* ---------- 상태 ---------- */
let cols, rows, cells, player, facing = 1;
let level = 1, score = 0, hearts = 3, stars = 0;
let items = [], traps = [], chasers = [], keysTotal = 0, keysGot = 0;
let startTime = 0, timerId = null, finished = false, dead = false;
let hintPath = null, hurtUntil = 0, graceUntil = 0, splats = [];
let paused = false, pauseStart = 0;

// 일시정지 중에는 시계를 멈춘다 (추적자·애니메이션·경과 시간이 함께 멈춘다)
const now = () => (paused ? pauseStart : Date.now());

const DIRS = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
const at = (x, y) => (x < 0 || y < 0 || x >= cols || y >= rows) ? null : cells[y * cols + x];
const keyOf = (x, y) => y * cols + x;

function makeGrid(c, r) {
  const g = [];
  for (let y = 0; y < r; y++)
    for (let x = 0; x < c; x++)
      g.push({ x, y, walls: [true, true, true, true], visited: false });
  return g;
}

// 깊이 우선 탐색으로 미로 생성
function generate() {
  cells = makeGrid(cols, rows);
  const stack = [];
  let cur = cells[0];
  cur.visited = true;
  let seen = 1;
  while (seen < cells.length) {
    const next = [];
    for (const [dx, dy, w, ow] of DIRS) {
      const n = at(cur.x + dx, cur.y + dy);
      if (n && !n.visited) next.push([n, w, ow]);
    }
    if (next.length) {
      const [n, w, ow] = next[Math.floor(Math.random() * next.length)];
      cur.walls[w] = false;
      n.walls[ow] = false;
      n.visited = true;
      seen++;
      stack.push(cur);
      cur = n;
    } else {
      cur = stack.pop();
    }
  }
}

// 벽을 일부 허물어 갈림길(루프)을 만든다.
// 완전 미로는 두 칸 사이 경로가 하나뿐이라 추적자를 피할 수 없다.
function braid(deadEndRate, loopRate) {
  const openWall = c => {
    const opts = [];
    for (const [dx, dy, w, ow] of DIRS) {
      if (!c.walls[w]) continue;
      const n = at(c.x + dx, c.y + dy);
      if (n) opts.push([n, w, ow]);
    }
    if (!opts.length) return false;
    const [n, w, ow] = opts[Math.floor(Math.random() * opts.length)];
    c.walls[w] = false;
    n.walls[ow] = false;
    return true;
  };
  for (const c of cells) {
    if (c.walls.filter(Boolean).length !== 3) continue;
    if (Math.random() > deadEndRate) continue;
    openWall(c);
  }
  const extra = Math.floor(cells.length * loopRate);
  for (let i = 0; i < extra; i++)
    openWall(cells[Math.floor(Math.random() * cells.length)]);
}

// 아가리를 밟지 않고 목표 칸에 닿을 수 있는지
function reachableAvoidingTraps(from, to, blocked) {
  if (blocked.has(keyOf(to.x, to.y))) return false;
  const seen = new Set([keyOf(from.x, from.y)]);
  const q = [from];
  while (q.length) {
    const c = q.shift();
    if (c === to) return true;
    for (const [dx, dy, w] of DIRS) {
      if (c.walls[w]) continue;
      const n = at(c.x + dx, c.y + dy);
      if (!n) continue;
      const k = keyOf(n.x, n.y);
      if (seen.has(k) || blocked.has(k)) continue;
      seen.add(k);
      q.push(n);
    }
  }
  return false;
}

// 열쇠와 출구까지 아가리를 밟지 않는 경로가 남도록 정리
function ensureSafeRoutes() {
  const start = at(0, 0);
  const goal = cells[cells.length - 1];
  const targets = items.filter(it => it.type === 'key').map(it => at(it.x, it.y)).concat([goal]);
  let guard = 0;
  while (guard++ < 200) {
    const blocked = new Set(traps.map(t => keyOf(t.x, t.y)));
    const bad = targets.find(t => !reachableAvoidingTraps(start, t, blocked));
    if (!bad) break;
    const path = pathTo(start, bad);
    const i = traps.findIndex(tr => path.some(c => c.x === tr.x && c.y === tr.y));
    traps.splice(i < 0 ? traps.length - 1 : i, 1);
    if (!traps.length) break;
  }
}

// 너비 우선 탐색: from 에서 모든 칸까지의 거리 + 직전 칸
function bfs(from) {
  const prev = new Map(), dist = new Map();
  dist.set(from, 0);
  const q = [from];
  while (q.length) {
    const c = q.shift();
    for (const [dx, dy, w] of DIRS) {
      if (c.walls[w]) continue;
      const n = at(c.x + dx, c.y + dy);
      if (!n || dist.has(n)) continue;
      dist.set(n, dist.get(c) + 1);
      prev.set(n, c);
      q.push(n);
    }
  }
  return { prev, dist };
}

function pathTo(from, to) {
  const { prev } = bfs(from);
  const path = [];
  for (let c = to; c; c = prev.get(c)) path.push(c);
  return path.reverse();
}

function farthestFrom(c) {
  const { dist } = bfs(c);
  let best = c, bd = -1;
  for (const [cell, d] of dist) if (d > bd) { bd = d; best = cell; }
  return best;
}

function pickCells(n, used) {
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 3000) {
    const c = cells[Math.floor(Math.random() * cells.length)];
    const k = keyOf(c.x, c.y);
    if (k === 0 || k === cells.length - 1 || used.has(k)) continue;
    used.add(k);
    out.push(c);
  }
  return out;
}

/* ---------- 층 구성 ---------- */
function newMaze(lv) {
  const d = D();
  cols = rows = Math.min(8 + (lv - 1) * d.grow, d.maxCols);
  generate();
  braid(d.braid, d.loops);

  const used = new Set();
  keysTotal = d.keys(lv);
  keysGot = 0;

  items = [];
  for (const c of pickCells(keysTotal, used)) items.push({ x: c.x, y: c.y, type: 'key' });
  for (const c of pickCells(4 + lv, used)) items.push({ x: c.x, y: c.y, type: 'star' });
  for (const c of pickCells(Math.max(1, Math.floor(lv / 2)), used)) items.push({ x: c.x, y: c.y, type: 'gem' });
  if (hearts < MAX_HEARTS)
    for (const c of pickCells(hearts <= 1 ? 2 : 1, used)) items.push({ x: c.x, y: c.y, type: 'heart' });

  traps = pickCells(d.traps(lv), used).map(c => ({ x: c.x, y: c.y }));
  ensureSafeRoutes();

  player = { x: 0, y: 0 };
  facing = 1;
  stars = 0;
  finished = false;
  dead = false;
  hintPath = null;
  hurtUntil = 0;
  splats = [];

  chasers = [];
  if (lv >= d.chaserFrom) {
    const n = d.chasers(lv);
    const far = farthestFrom(at(0, 0));
    const spots = [far, at(cols - 1, 0), at(0, rows - 1), at(cols - 1, rows - 1)];
    for (let i = 0; i < n; i++) spawnChaser(spots[i % spots.length], d.chaserStep + i * 90);
  }

  paused = false;
  const pb = document.getElementById('pause');
  if (pb) pb.textContent = '일시정지';

  startTime = Date.now();
  graceUntil = startTime + d.grace;
  clearInterval(timerId);
  timerId = setInterval(updateHud, 200);
  document.getElementById('msg').textContent =
    chasers.length ? '놈이 ' + (d.grace / 1000) + '초 뒤 눈을 뜬다…' : '';
  updateHud();
}

function spawnChaser(cell, step) {
  chasers.push({ x: cell.x, y: cell.y, px: cell.x, py: cell.y, t0: Date.now(), step });
}

function restartGame() {
  level = 1; score = 0; hearts = D().hearts;
  newMaze(1);
}

function updateHud() {
  document.getElementById('level').textContent = level;
  document.getElementById('stars').textContent = stars;
  document.getElementById('score').textContent = score;
  document.getElementById('keyst').textContent = keysGot + '/' + keysTotal;
  document.getElementById('vitals').textContent =
    '🫀'.repeat(hearts) + '🕳'.repeat(Math.max(0, D().hearts - hearts));
  if (!finished && !dead)
    document.getElementById('time').textContent = Math.floor((now() - startTime) / 1000);
}

/* ---------- 그리기 ---------- */
const PAL = {
  wall: '#9c3a38', wallDark: '#48171a', glow: 'rgba(200,50,45,.4)',
  flesh: '#cbb4a4', fleshDark: '#8d6d61', blood: '#8d1220', bone: '#e2d7c3',
  bile: '#9aa653', pupil: '#120a0c'
};

// 이빨 (점수 아이템)
function drawTooth(cx, cy, r) {
  ctx.fillStyle = PAL.bone;
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.55, cy - r * 0.6);
  ctx.quadraticCurveTo(cx, cy - r * 0.95, cx + r * 0.55, cy - r * 0.6);
  ctx.lineTo(cx + r * 0.35, cy + r * 0.25);
  ctx.quadraticCurveTo(cx + r * 0.2, cy + r, cx + r * 0.05, cy + r * 0.35);
  ctx.quadraticCurveTo(cx - r * 0.15, cy + r, cx - r * 0.35, cy + r * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(120,30,30,.35)';
  ctx.fillRect(cx - r * 0.4, cy + r * 0.05, r * 0.8, r * 0.12);
}

// 안구 (고가치 아이템) — 주인공을 응시한다
function drawEyeball(cx, cy, r, px, py) {
  const a = Math.atan2(py - cy, px - cx);
  ctx.fillStyle = '#efe6dd';
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.85, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,25,30,.6)';
  ctx.lineWidth = Math.max(0.8, r * 0.08);
  for (let i = 0; i < 4; i++) {
    const t = i * 1.7;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(t) * r * 0.2, cy + Math.sin(t) * r * 0.2);
    ctx.quadraticCurveTo(cx + Math.cos(t + .4) * r * 0.6, cy + Math.sin(t + .4) * r * 0.6,
                         cx + Math.cos(t) * r * 0.85, cy + Math.sin(t) * r * 0.85);
    ctx.stroke();
  }
  const ex = cx + Math.cos(a) * r * 0.3, ey = cy + Math.sin(a) * r * 0.3;
  ctx.fillStyle = '#6b2a12';
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.pupil;
  ctx.beginPath(); ctx.arc(ex, ey, r * 0.2, 0, Math.PI * 2); ctx.fill();
}

// 심장 (회복) — 박동한다
function drawOrganHeart(cx, cy, r, t) {
  const beat = 1 + Math.sin(t / 160) * 0.07 + (Math.sin(t / 53) > 0.96 ? 0.06 : 0);
  r *= beat;
  ctx.fillStyle = '#9c1b28';
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.9);
  ctx.bezierCurveTo(cx - r * 1.45, cy - r * 0.3, cx - r * 0.5, cy - r * 1.15, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx + r * 0.5, cy - r * 1.15, cx + r * 1.45, cy - r * 0.3, cx, cy + r * 0.9);
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,5,10,.7)';
  ctx.lineWidth = Math.max(1, r * 0.13);
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.35, cy - r * 0.4);
  ctx.quadraticCurveTo(cx - r * 0.1, cy + r * 0.1, cx - r * 0.3, cy + r * 0.5);
  ctx.moveTo(cx + r * 0.3, cy - r * 0.45);
  ctx.quadraticCurveTo(cx + r * 0.05, cy, cx + r * 0.25, cy + r * 0.45);
  ctx.stroke();
}

// 뼈 열쇠
function drawBoneKey(cx, cy, r) {
  ctx.strokeStyle = PAL.bone;
  ctx.fillStyle = PAL.bone;
  ctx.lineWidth = Math.max(1.5, r * 0.28);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx - r * 0.4, cy, r * 0.42, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.02, cy); ctx.lineTo(cx + r * 0.9, cy);
  ctx.moveTo(cx + r * 0.9, cy);  ctx.lineTo(cx + r * 0.9, cy + r * 0.45);
  ctx.moveTo(cx + r * 0.55, cy); ctx.lineTo(cx + r * 0.55, cy + r * 0.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + r * 0.95, cy - r * 0.12, r * 0.17, 0, Math.PI * 2);
  ctx.fill();
}

// 바닥의 아가리 (함정)
function drawMaw(cx, cy, r, t) {
  const open = 0.75 + Math.sin(t / 340 + cx * 0.7) * 0.25;
  ctx.fillStyle = '#1b0508';
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#5e1219';
  ctx.lineWidth = Math.max(1, r * 0.18);
  ctx.stroke();
  // 안쪽 이빨 고리
  ctx.fillStyle = PAL.bone;
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + t / 2600;
    const len = r * 0.45 * open;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a - .18) * r * 0.9, cy + Math.sin(a - .18) * r * 0.78);
    ctx.lineTo(cx + Math.cos(a) * (r * 0.9 - len), cy + Math.sin(a) * (r * 0.78 - len));
    ctx.lineTo(cx + Math.cos(a + .18) * r * 0.9, cy + Math.sin(a + .18) * r * 0.78);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(140,10,25,' + (0.25 + open * 0.2) + ')';
  ctx.beginPath();
  ctx.ellipse(cx, cy, r * 0.35, r * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
}

// 주인공 — 창백한 살덩이
function drawHero(cx, cy, r, t) {
  const hurt = now() < hurtUntil;
  if (hurt && Math.floor(now() / 90) % 2) return;
  cy += Math.sin(t / 220) * r * 0.05;

  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.95, r * 0.7, r * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();

  // 울렁이는 몸통
  ctx.fillStyle = hurt ? '#a6474b' : PAL.flesh;
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const wob = 1 + Math.sin(a * 3 + t / 260) * 0.07;
    const px = cx + Math.cos(a) * r * 0.8 * wob;
    const py = cy + Math.sin(a) * r * 0.76 * wob;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // 핏줄
  ctx.strokeStyle = 'rgba(110,30,35,.45)';
  ctx.lineWidth = Math.max(0.7, r * 0.05);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + s * r * 0.15, cy - r * 0.5);
    ctx.quadraticCurveTo(cx + s * r * 0.55, cy - r * 0.1, cx + s * r * 0.3, cy + r * 0.5);
    ctx.stroke();
  }

  // 세 개의 눈
  const look = facing * r * 0.07;
  const blink = Math.sin(t / 900) > 0.97;
  const eyes = [[-0.3, -0.12], [0.3, -0.12], [0, -0.45]];
  for (const [ox, oy] of eyes) {
    const ex = cx + ox * r + look, ey = cy + oy * r;
    ctx.fillStyle = PAL.pupil;
    ctx.beginPath();
    if (blink) ctx.ellipse(ex, ey, r * 0.13, r * 0.02, 0, 0, Math.PI * 2);
    else ctx.ellipse(ex, ey, r * 0.13, r * 0.17, 0, 0, Math.PI * 2);
    ctx.fill();
    if (!blink) {
      ctx.fillStyle = '#d9c7b6';
      ctx.beginPath();
      ctx.arc(ex + r * 0.05, ey - r * 0.06, r * 0.035, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 꿰맨 입
  ctx.strokeStyle = '#4a2020';
  ctx.lineWidth = Math.max(1, r * 0.06);
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.3 + look, cy + r * 0.34);
  ctx.lineTo(cx + r * 0.3 + look, cy + r * 0.34);
  ctx.stroke();
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(cx + i * r * 0.13 + look, cy + r * 0.26);
    ctx.lineTo(cx + i * r * 0.13 + look, cy + r * 0.42);
    ctx.stroke();
  }
}

// 추적자 — 눈이 여러 개 달린 어둠
function drawChaser(cx, cy, r, t, sleeping, dir) {
  cy += Math.sin(t / 240 + cx) * r * 0.07;

  if (!sleeping) {
    ctx.fillStyle = 'rgba(150,15,25,.18)';
    ctx.beginPath();
    ctx.arc(cx, cy, r * (1.5 + Math.sin(t / 200) * 0.15), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = sleeping ? 0.78 : 1;

  // 흘러내리는 덩어리
  ctx.fillStyle = sleeping ? '#3a1a22' : '#1d0c12';
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.05, r * 0.8, Math.PI, 0);
  const b = cy + r * 0.7, w = r * 0.8;
  ctx.lineTo(cx + w, b);
  for (let i = 0; i < 4; i++) {
    const x1 = cx + w - (i * 2 + 1) * w / 4;
    const x2 = cx + w - (i * 2 + 2) * w / 4;
    const drip = Math.sin(t / 300 + i) * r * 0.12;
    ctx.quadraticCurveTo(x1, b + (i % 2 ? -r * 0.2 : r * 0.3 + drip), x2, b);
  }
  ctx.closePath();
  ctx.fill();

  // 테두리 살점
  ctx.strokeStyle = sleeping ? 'rgba(150,50,60,.85)' : 'rgba(190,30,40,.95)';
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.stroke();

  // 눈 무리
  const look = dir * r * 0.14;
  const eyes = [[-0.34, -0.2], [0.02, -0.34], [0.36, -0.16], [-0.16, 0.06], [0.24, 0.12]];
  eyes.forEach(([ox, oy], i) => {
    const ex = cx + ox * r + look, ey = cy + oy * r;
    if (sleeping) {
      ctx.strokeStyle = 'rgba(190,60,60,.5)';
      ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.1, ey); ctx.lineTo(ex + r * 0.1, ey);
      ctx.stroke();
    } else {
      const pulse = 0.75 + Math.sin(t / 180 + i) * 0.25;
      ctx.fillStyle = 'rgba(220,40,45,' + pulse + ')';
      ctx.beginPath();
      ctx.arc(ex, ey, r * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = PAL.pupil;
      ctx.beginPath();
      ctx.arc(ex + look * 0.3, ey, r * 0.04, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 벌어진 아가리
  if (!sleeping) {
    ctx.fillStyle = '#5c0d16';
    ctx.beginPath();
    ctx.ellipse(cx + look, cy + r * 0.42, r * 0.26, r * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = PAL.bone;
    for (let i = -2; i <= 2; i++) {
      const tx = cx + look + i * r * 0.1;
      ctx.beginPath();
      ctx.moveTo(tx - r * 0.04, cy + r * 0.26);
      ctx.lineTo(tx, cy + r * 0.44);
      ctx.lineTo(tx + r * 0.04, cy + r * 0.26);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// 봉인된 문
function drawGoal(cx, cy, r, t) {
  const open = keysGot >= keysTotal;
  if (open) {
    ctx.fillStyle = '#b01a26';
    ctx.globalAlpha = 0.2 + Math.sin(t / 220) * 0.14;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // 문틀
  ctx.fillStyle = open ? '#150407' : '#4a1418';
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.65, cy + r * 0.85);
  ctx.lineTo(cx - r * 0.65, cy - r * 0.2);
  ctx.quadraticCurveTo(cx, cy - r * 1.2, cx + r * 0.65, cy - r * 0.2);
  ctx.lineTo(cx + r * 0.65, cy + r * 0.85);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = open ? '#b01a26' : '#7d2a2c';
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.stroke();

  if (open) {
    // 빨아들이는 어둠
    ctx.fillStyle = 'rgba(180,25,35,' + (0.3 + Math.sin(t / 180) * 0.15) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.25, r * 0.3, r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // 꿰맨 봉인
    ctx.strokeStyle = PAL.bone;
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.5, cy + r * 0.15);
    ctx.lineTo(cx + r * 0.5, cy + r * 0.15);
    ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * r * 0.2, cy - r * 0.02);
      ctx.lineTo(cx + i * r * 0.2, cy + r * 0.32);
      ctx.stroke();
    }
  }
}

// 화면 크기에 맞춰 캔버스 실제 픽셀 수를 맞춘다 (레티나에서 뭉개지지 않도록).
// 그리기 코드는 계속 520 기준 좌표를 쓰고, 배율만 변환 행렬로 준다.
function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssW = cv.getBoundingClientRect().width || SIZE;
  const px = Math.max(1, Math.round(cssW * dpr));
  if (cv.width !== px) { cv.width = px; cv.height = px; }
}
addEventListener('resize', fitCanvas);
addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));

function draw() {
  fitCanvas();
  const k = cv.width / SIZE;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const t = now();
  const cell = SIZE / cols;
  const half = cell / 2;
  const shake = t < hurtUntil ? (hurtUntil - t) / 1200 * 6 : 0;

  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  ctx.fillStyle = '#0a0709';
  ctx.fillRect(-10, -10, SIZE + 20, SIZE + 20);

  // 출발 지점의 마른 핏자국
  ctx.fillStyle = 'rgba(90,15,20,.25)';
  ctx.fillRect(0, 0, cell, cell);

  // 바닥에 남은 핏자국
  for (const s of splats) {
    ctx.fillStyle = 'rgba(110,12,20,' + s.a + ')';
    ctx.beginPath();
    ctx.ellipse(s.x * cell + half, s.y * cell + half, cell * 0.3, cell * 0.24, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  drawGoal((cols - 1) * cell + half, (rows - 1) * cell + half, cell * 0.36, t);

  if (hintPath) {
    ctx.strokeStyle = 'rgba(170,25,35,.55)';
    ctx.lineWidth = Math.max(2, cell * 0.16);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([cell * 0.05, cell * 0.25]);
    ctx.beginPath();
    hintPath.forEach((c, i) => {
      const px = c.x * cell + half, py = c.y * cell + half;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  for (const tr of traps)
    drawMaw(tr.x * cell + half, tr.y * cell + half, cell * 0.3, t);

  for (const it of items) {
    const cx = it.x * cell + half;
    const cy = it.y * cell + half + Math.sin(t / 420 + it.x + it.y) * cell * 0.04;
    const r = cell * 0.28;
    if (it.type === 'star') drawTooth(cx, cy, r);
    else if (it.type === 'gem')
      drawEyeball(cx, cy, r, player.x * cell + half, player.y * cell + half);
    else if (it.type === 'heart') drawOrganHeart(cx, cy, r * 0.9, t);
    else drawBoneKey(cx, cy, r);
  }

  // 벽 — 힘줄처럼 번들거린다
  ctx.shadowColor = PAL.glow;
  ctx.shadowBlur = Math.max(4, cell * 0.35);
  ctx.strokeStyle = PAL.wall;
  ctx.lineWidth = Math.max(1.5, cell * 0.1);
  ctx.lineCap = 'square';
  ctx.beginPath();
  for (const c of cells) {
    const x = c.x * cell, y = c.y * cell;
    if (c.walls[0]) { ctx.moveTo(x, y);        ctx.lineTo(x + cell, y); }
    if (c.walls[1]) { ctx.moveTo(x + cell, y); ctx.lineTo(x + cell, y + cell); }
    if (c.walls[2]) { ctx.moveTo(x, y + cell); ctx.lineTo(x + cell, y + cell); }
    if (c.walls[3]) { ctx.moveTo(x, y);        ctx.lineTo(x, y + cell); }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = PAL.wallDark;
  ctx.lineWidth = Math.max(0.6, cell * 0.03);
  ctx.stroke();

  if (!dead) drawHero(player.x * cell + half, player.y * cell + half, cell * 0.36, t);

  const sleeping = t < graceUntil;
  for (const ch of chasers) {
    const p = Math.min(1, (t - ch.t0) / ch.step);
    const gx = (ch.px + (ch.x - ch.px) * p) * cell + half;
    const gy = (ch.py + (ch.y - ch.py) * p) * cell + half;
    drawChaser(gx, gy, cell * 0.36, t, sleeping, Math.sign(player.x - ch.x) || 0);
  }

  ctx.restore();

  // 어둠이 가장자리를 먹는다
  const vig = ctx.createRadialGradient(SIZE / 2, SIZE / 2, SIZE * 0.32, SIZE / 2, SIZE / 2, SIZE * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // 피격 시 붉은 시야
  if (t < hurtUntil) {
    ctx.fillStyle = 'rgba(150,10,20,' + ((hurtUntil - t) / 1200 * 0.45) + ')';
    ctx.fillRect(0, 0, SIZE, SIZE);
  }
  // 심장이 하나 남으면 숨이 가빠진다
  if (!dead && hearts === 1) {
    ctx.fillStyle = 'rgba(120,8,16,' + (0.1 + Math.sin(t / 260) * 0.09) + ')';
    ctx.fillRect(0, 0, SIZE, SIZE);
  }
  if (dead) {
    ctx.fillStyle = 'rgba(10,0,2,.72)';
    ctx.fillRect(0, 0, SIZE, SIZE);
  }

  if (paused) drawPauseVeil(t);

  // 필름 그레인
  ctx.fillStyle = 'rgba(255,240,235,.03)';
  for (let i = 0; i < 90; i++)
    ctx.fillRect(Math.random() * SIZE, Math.random() * SIZE, 1, 1);
}

/* ---------- 게임 로직 ---------- */
let flashId = null;
function flash(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  clearTimeout(flashId);
  flashId = setTimeout(() => { if (!finished && !dead) el.textContent = ''; }, 1400);
}

function gameOver(reason) {
  dead = true;
  clearInterval(timerId);
  document.getElementById('msg').textContent =
    reason + ' 미로가 당신을 삼켰다 — 제물 ' + score + ' · ' + level + '층';
  updateHud();
}

function bleed() {
  splats.push({ x: player.x, y: player.y, a: 0.35 + Math.random() * 0.25, r: Math.random() * Math.PI });
  if (splats.length > 40) splats.shift();
}

function damage(reason) {
  if (now() < hurtUntil) return;
  hearts--;
  score = Math.max(0, score - 5);
  hurtUntil = now() + 1200;
  bleed();
  updateHud();
  if (hearts <= 0) { gameOver(reason); return; }
  flash(reason + ' 심장 −1');
}

function pickup() {
  const i = items.findIndex(it => it.x === player.x && it.y === player.y);
  if (i < 0) return;
  const it = items.splice(i, 1)[0];
  if (it.type === 'star') { stars++; score += 10; flash('🦷 이빨을 주웠다 +10'); }
  else if (it.type === 'gem') { score += 30; flash('👁 아직 따뜻한 안구 +30'); }
  else if (it.type === 'heart') { hearts = Math.min(MAX_HEARTS, hearts + 1); flash('🫀 심장이 다시 뛴다'); }
  else {
    keysGot++;
    flash(keysGot >= keysTotal
      ? '🦴 봉인이 풀렸다… 문이 열린다'
      : '🦴 뼈열쇠 (' + keysGot + '/' + keysTotal + ')');
  }
}

function hitTrap() {
  const i = traps.findIndex(t => t.x === player.x && t.y === player.y);
  if (i < 0) return;
  if (now() < hurtUntil) return;
  traps.splice(i, 1);
  damage('🕳 바닥이 씹었다!');
}

function checkCaught() {
  if (dead || finished || paused || now() < graceUntil) return;
  for (const ch of chasers) {
    if (ch.x === player.x && ch.y === player.y) {
      damage('놈이 물어뜯었다!');
      if (!dead) {
        const far = farthestFrom(at(player.x, player.y));
        for (const c of chasers) {
          c.x = c.px = far.x; c.y = c.py = far.y;
          c.t0 = now();
        }
        graceUntil = now() + 1500;
      }
      return;
    }
  }
}

function stepChasers(now) {
  if (dead || finished || paused || now < graceUntil) return;
  for (const ch of chasers) {
    if (now - ch.t0 < ch.step) continue;
    ch.px = ch.x; ch.py = ch.y; ch.t0 = now;
    const path = pathTo(at(ch.x, ch.y), at(player.x, player.y));
    if (path.length > 1) { ch.x = path[1].x; ch.y = path[1].y; }
  }
  checkCaught();
}

/* ---------- 일시정지 ---------- */
function setPaused(on) {
  if (dead || finished || paused === on) return;
  if (on) {
    paused = true;
    pauseStart = Date.now();   // 이 시각에 시계를 세운다
    clearInterval(timerId);
  } else {
    // 멈춰 있던 만큼 모든 마감 시각을 뒤로 민다
    const dt = Date.now() - pauseStart;
    startTime += dt;
    graceUntil += dt;
    hurtUntil += dt;
    for (const c of chasers) c.t0 += dt;
    paused = false;
    timerId = setInterval(updateHud, 200);
  }
  document.getElementById('pause').textContent = paused ? '계속하기' : '일시정지';
  updateHud();
}
const togglePause = () => setPaused(!paused);

function drawPauseVeil(t) {
  ctx.fillStyle = 'rgba(6,2,4,.8)';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(200,70,75,' + (0.7 + Math.sin(Date.now() / 600) * 0.25) + ')';
  ctx.font = '28px Georgia, serif';
  ctx.fillText('숨 을 고 른 다', SIZE / 2, SIZE / 2 - 6);
  ctx.fillStyle = 'rgba(150,120,115,.75)';
  ctx.font = '14px Georgia, serif';
  ctx.fillText('Esc · P · [계속하기] 로 다시 들어간다', SIZE / 2, SIZE / 2 + 26);
  ctx.textAlign = 'left';
}

function move(dir) {
  if (finished || dead || paused) return;
  const map = { U: [0, -1, 0], R: [1, 0, 1], D: [0, 1, 2], L: [-1, 0, 3] };
  const [dx, dy, w] = map[dir];
  if (dx) facing = dx;
  const c = at(player.x, player.y);
  if (c.walls[w]) return;
  const n = at(player.x + dx, player.y + dy);
  if (!n) return;

  player = { x: n.x, y: n.y };
  pickup();
  hitTrap();
  if (dead) return;
  checkCaught();
  if (dead) return;

  if (player.x === cols - 1 && player.y === rows - 1) {
    if (keysGot < keysTotal) {
      flash('꿰매어져 있다… 뼈열쇠 ' + (keysTotal - keysGot) + '개가 더 필요하다');
    } else {
      finished = true;
      clearInterval(timerId);
      const sec = Math.floor((now() - startTime) / 1000);
      const bonus = Math.max(0, 100 - sec * 2);
      score += 50 + bonus;
      document.getElementById('msg').textContent =
        level + '층 탈출… ' + sec + '초 · 제물 ' + (50 + bonus) + ' 획득 · 합계 ' + score +
        ' — 더 깊은 곳이 기다린다';
      setTimeout(() => { level++; newMaze(level); }, 3000);
    }
  }
  updateHud();
}

/* ---------- 입력 ---------- */
const KEYS = {
  ArrowUp: 'U', ArrowRight: 'R', ArrowDown: 'D', ArrowLeft: 'L',
  w: 'U', d: 'R', s: 'D', a: 'L', W: 'U', D: 'R', S: 'D', A: 'L'
};
addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    togglePause();
    return;
  }
  const dir = KEYS[e.key];
  if (!dir) return;
  e.preventDefault();
  move(dir);
});

// 탭을 벗어나면 저절로 멈춘다 (자리를 비운 사이 잡아먹히지 않도록)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) setPaused(true);
});
addEventListener('blur', () => setPaused(true));

document.getElementById('pad').addEventListener('click', e => {
  const d = e.target.dataset.d;
  if (d) move(d);
});

document.getElementById('pause').onclick = () => { togglePause(); cv.focus(); };
document.getElementById('again').onclick = () => newMaze(level);
document.getElementById('reset').onclick = restartGame;
document.getElementById('hint').onclick = () => {
  if (dead) return;
  if (hintPath) { hintPath = null; return; }
  const here = at(player.x, player.y);
  const keys = items.filter(it => it.type === 'key');
  if (keys.length) {
    let best = null;
    for (const k of keys) {
      const p = pathTo(here, at(k.x, k.y));
      if (!best || p.length < best.length) best = p;
    }
    hintPath = best;
  } else {
    hintPath = pathTo(here, cells[cells.length - 1]);
  }
};

const diffSel = document.getElementById('diff');
function applyDifficulty(save) {
  diff = diffSel.value;
  document.getElementById('diffInfo').textContent = D().desc;
  if (save) { try { localStorage.setItem('mazeDiff', diff); } catch (e) {} }
  restartGame();
}
diffSel.onchange = () => applyDifficulty(true);
try {
  const saved = localStorage.getItem('mazeDiff');
  if (saved && LEVELS[saved]) diffSel.value = saved;
} catch (e) {}

// 터치 스와이프
let t0 = null;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
cv.addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  t0 = null;
  if (Math.hypot(dx, dy) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
}, { passive: true });

applyDifficulty(false);
(function loop() {
  stepChasers(Date.now());
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
